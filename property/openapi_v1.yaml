  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Login using either email or username in 'identifier'. Returns JWT
        refresh/access tokens on success.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              LoginRequest:
                value:
                  identifier: user@email.com
                  password: password123
                  turnstile_token: cf-turnstile-token-example
                summary: Login Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOkResponse'
              examples:
                LoginRequest:
                  value:
                    identifier: user@email.com
                    password: password123
                    turnstile_token: cf-turnstile-token-example
                  summary: Login Request
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginErrorResponse'
              examples:
                InvalidCredentials:
                  value:
                    ok: false
                    message: Invalid credentials.
                    detail: Invalid credentials.
                    status: 400
                  summary: Invalid credentials
          description: Invalid input or invalid credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEmailNotVerifiedResponse'
              examples:
                EmailNotVerified:
                  value:
                    ok: false
                    message: Please verify your email with the 6-digit code we sent.
                    detail: Please verify your email with the 6-digit code we sent.
                    status: 403
                  summary: Email not verified
          description: Email not verified.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRateLimitedResponse'
              examples:
                TooManyFailedAttempts:
                  value:
                    ok: false
                    message: Too many failed attempts. Try again later.
                    detail: Too many failed attempts. Try again later.
                    status: 429
                    code: lockout
                  summary: Too many failed attempts
          description: Too many failed attempts.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revoke the supplied refresh token and terminate the session. Logout
        authenticates using the submitted refresh token rather than the short-lived
        access token so users can always sign out even after the access token has
        expired.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
